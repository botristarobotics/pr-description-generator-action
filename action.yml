name: 'Generate PR Description Action'
description: 'Generate PR descriptions using OpenAI API'
author: 'class90431'

inputs:
  repository_owner:
    required: true
    type: string
  repository_name:
    required: true
    type: string
  pull_request_number:
    required: true
    type: string
  branch_name:
    required: true
    type: string
  model:
    description: 'OpenAI model used to generate the description'
    required: false
    default: 'gpt-5.4'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'message-circle'
  color: 'blue'
